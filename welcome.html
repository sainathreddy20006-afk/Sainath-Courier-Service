<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Sainath Express Courier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030712;
      overflow: hidden;
    }

    /* --- CARTOON AIRPLANE FLIGHT ANIMATIONS --- */

    /* 1. West to East Flight */
    @keyframes flyEast {
      0% { transform: translate(-20vw, 8vh) rotate(3deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(120vw, 12vh) rotate(3deg); opacity: 0; }
    }
    .plane-east { animation: flyEast 8s linear infinite; }

    /* 2. East to West Flight */
    @keyframes flyWest {
      0% { transform: translate(120vw, 28vh) scaleX(-1) rotate(-3deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translate(-20vw, 24vh) scaleX(-1) rotate(-3deg); opacity: 0; }
    }
    .plane-west { animation: flyWest 10s linear infinite 1.5s; }

    /* 3. North-West to South-East Diagonal Flight */
    @keyframes flySouthEast {
      0% { transform: translate(-10vw, -10vh) rotate(35deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(110vw, 110vh) rotate(35deg); opacity: 0; }
    }
    .plane-southeast { animation: flySouthEast 9s linear infinite 0.8s; }

    /* 4. South-West to North-East Diagonal Flight */
    @keyframes flyNorthEast {
      0% { transform: translate(-10vw, 100vh) rotate(-35deg); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(110vw, -10vh) rotate(-35deg); opacity: 0; }
    }
    .plane-northeast { animation: flyNorthEast 11s linear infinite 3s; }

    /* Floating / Wiggle motion for cartoon effect */
    @keyframes bobble {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .cartoon-float { animation: bobble 2s ease-in-out infinite; }

    /* --- HOUSE DOOR & BOX ANIMATIONS --- */

    @keyframes doorOpen {
      0% { transform: perspective(1000px) rotateY(0deg); }
      100% { transform: perspective(1000px) rotateY(-110deg); }
    }
    .door-opening {
      animation: doorOpen 1.8s 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      transform-origin: left;
    }

    @keyframes boxSlideOut {
      0% { transform: translate(-50%, 40px) scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }
    .box-appear {
      animation: boxSlideOut 1.2s 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.9)); }
    }
    .pulse-box {
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes modalPop {
      0% { transform: translate(-50%, -40%) scale(0.5); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    .modal-appear {
      animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between items-center p-4 relative select-none overflow-hidden">

  <!-- Background Sky & Glowing Ambient Light -->
  <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black pointer-events-none"></div>
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-orange-500/10 rounded-full blur-[140px] pointer-events-none"></div>

  <!-- Header -->
  <header class="relative z-30 w-full max-w-4xl py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-orange-500 rounded-xl flex items-center justify-center font-black text-xl shadow-lg shadow-orange-500/30">
        📦
      </div>
      <span class="text-xl sm:text-2xl font-black tracking-tight">SAINATH <span class="text-orange-500">EXPRESS</span></span>
    </div>
  </header>

  <!-- 4 CARTOON AIRPLANES (NO TEXT BOXES) -->
  <div class="fixed inset-0 pointer-events-none z-20 overflow-hidden">
    
    <!-- Airplane 1: Flying East -->
    <div class="plane-east absolute top-0 left-0">
      <div class="cartoon-float flex items-center gap-1 filter drop-shadow-[0_10px_15px_rgba(249,115,22,0.4)]">
        <span class="text-5xl sm:text-6xl">✈️</span>
        <span class="text-2xl sm:text-3xl -ml-3">📦</span>
      </div>
    </div>

    <!-- Airplane 2: Flying West -->
    <div class="plane-west absolute top-0 left-0">
      <div class="cartoon-float flex items-center gap-1 filter drop-shadow-[0_10px_15px_rgba(245,158,11,0.4)]">
        <span class="text-5xl sm:text-6xl">✈️</span>
        <span class="text-2xl sm:text-3xl -ml-3">📦</span>
      </div>
    </div>

    <!-- Airplane 3: Flying South-East -->
    <div class="plane-southeast absolute top-0 left-0">
      <div class="cartoon-float flex items-center gap-1 filter drop-shadow-[0_10px_15px_rgba(249,115,22,0.4)]">
        <span class="text-5xl sm:text-6xl">✈️</span>
        <span class="text-2xl sm:text-3xl -ml-3">📦</span>
      </div>
    </div>

    <!-- Airplane 4: Flying North-East -->
    <div class="plane-northeast absolute top-0 left-0">
      <div class="cartoon-float flex items-center gap-1 filter drop-shadow-[0_10px_15px_rgba(234,88,12,0.4)]">
        <span class="text-5xl sm:text-6xl">✈️</span>
        <span class="text-2xl sm:text-3xl -ml-3">📦</span>
      </div>
    </div>

  </div>

  <!-- HOUSE & DOOR SCENE -->
  <main class="relative z-30 w-full max-w-md my-auto flex flex-col items-center">
    
    <!-- Status Banner -->
    <div id="statusBanner" class="mb-6 bg-slate-900/90 border border-orange-500/50 px-6 py-2 rounded-full text-xs font-extrabold text-orange-400 shadow-xl tracking-wide uppercase text-center backdrop-blur-md">
      🏠 Door Opening...
    </div>

    <!-- House Structure -->
    <div class="relative w-80 h-80 bg-slate-900 border-4 border-slate-700 rounded-t-full rounded-b-2xl shadow-2xl flex flex-col items-center justify-end p-4 overflow-hidden">
      
      <!-- House Label -->
      <div class="absolute top-6 text-slate-500 text-xs font-black tracking-widest uppercase">
        Sainath Express Hub
      </div>

      <!-- Door Frame Outer -->
      <div class="relative w-36 h-56 bg-slate-950 border-4 border-slate-800 rounded-t-3xl flex items-end justify-center shadow-inner">
        
        <!-- Inside Warm Glow -->
        <div class="absolute inset-0 bg-gradient-to-t from-orange-500/40 to-amber-300/20 rounded-t-3xl blur-sm"></div>

        <!-- Door Panel -->
        <div id="homeDoor" class="door-opening absolute inset-0 bg-amber-900 border-2 border-amber-700 rounded-t-3xl flex items-center justify-end pr-2 shadow-2xl z-20">
          <div class="w-4 h-4 bg-amber-400 rounded-full shadow-md"></div>
        </div>

        <!-- COURIER BOX (Appears before door) -->
        <div id="courierBox" onclick="openWebsiteModal()" class="box-appear absolute bottom-2 left-1/2 -translate-x-1/2 z-30 opacity-0 cursor-pointer group">
          <div class="pulse-box relative text-7xl select-none transition transform group-hover:scale-110">
            📦
            <span class="absolute -top-7 left-1/2 -translate-x-1/2 whitespace-nowrap bg-orange-500 text-white text-[10px] font-black px-2.5 py-0.5 rounded-full shadow-lg">
              👉 TOUCH BOX
            </span>
          </div>
        </div>

      </div>

      <!-- Porch Ground -->
      <div class="w-full h-4 bg-slate-800 rounded-full mt-2 shadow-lg"></div>
    </div>

  </main>

  <!-- MODAL POP-UP: GO TO WEBSITE -->
  <div id="websiteModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md">
    <div class="modal-appear fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-11/12 max-w-sm bg-slate-950 border-2 border-orange-500 p-6 rounded-3xl shadow-2xl text-center space-y-4">
      
      <div class="w-16 h-16 bg-orange-500/20 border-2 border-orange-500 rounded-2xl flex items-center justify-center mx-auto text-4xl shadow-lg shadow-orange-500/30">
        📦
      </div>

      <div>
        <h3 class="text-2xl font-black text-white">Courier Package Opened!</h3>
        <p class="text-xs text-slate-300 mt-1 font-semibold">Your express portal is ready to access.</p>
      </div>

      <!-- LINK TO INDEX.HTML -->
      <a href="index.html" class="inline-flex items-center justify-center gap-3 w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-black text-base py-4 px-6 rounded-2xl shadow-xl shadow-orange-500/40 transition transform hover:scale-105 active:scale-95 border border-orange-400/30">
        <span>GO TO WEBSITE</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </a>

    </div>
  </div>

  <!-- Footer -->
  <footer class="relative z-30 py-4 text-center text-xs text-slate-500 font-semibold">
    <p>&copy; 2026 Sainath Express Courier Service</p>
  </footer>

  <!-- Script Controller -->
  <script>
    setTimeout(() => {
      document.getElementById('statusBanner').innerText = "📦 Courier Box Arriving At Door...";
    }, 2500);

    setTimeout(() => {
      document.getElementById('statusBanner').innerText = "👇 Touch the Box to Open Website!";
    }, 3800);

    function openWebsiteModal() {
      document.getElementById('websiteModal').classList.remove('hidden');
    }
  </script>

</body>
</html>
